# 아라니아 거래처 인텔리전스 — 이벤트 사전 v3.0
# score = 영향도 × 확실성 × 등급배수 × 보도확산배수
# 변경: 부정키워드·문맥게이트·에스컬레이션·임계값 대폭 상향

categories:

  # ── 사전지표 ─────────────────────────────────────
  COMEBACK:
    label: 컴백·신보 발매
    type: PRE
    impact: 3
    lead_days: 75
    keywords: [컴백, 신보, 정규앨범, 미니앨범, 싱글앨범, EP 발매, 컴백 확정,
               타이틀곡, 앨범 발매, 발매 확정, 콘셉트 포토, 티저, 선주문,
               예약판매, 리패키지, 트랙리스트, 하이라이트 메들리]
    # 아래 중 1개 이상 없으면 기각 — '컴백'만으로는 드라마·예능 복귀와 구분 불가
    require_any: [앨범, 싱글, 음반, 정규, 미니, EP, 타이틀곡, 발매, 신보,
                  트랙리스트, 리패키지, 선주문, 예약판매, 콘셉트 포토]
    exclude: [드라마, 영화, 예능, 시즌, 시청률, 스크린, 방송인, 개그맨, MC,
              출연, 하차, 합류, 예능캐, 시구, 게임, 웹툰, 뮤지컬, 연극]

  DEBUT:
    label: 신인 데뷔·데뷔조
    type: PRE
    impact: 3
    lead_days: 90
    keywords: [데뷔조, 신인 그룹, 프리데뷔, 데뷔 확정, 데뷔곡, 데뷔 앨범,
               데뷔 싱글, 신규 보이그룹, 신규 걸그룹, 정식 데뷔, 완전체 데뷔]
    require_any: [데뷔 앨범, 데뷔곡, 데뷔 싱글, 데뷔 확정, 정식 데뷔, 완전체 데뷔,
                  프리데뷔, 데뷔조, 신인 그룹, 신규 걸그룹, 신규 보이그룹]
    # '데뷔 10주년', '차트 24위로 데뷔' 등 기념·차트성 기사 배제
    exclude: [주년, 빌보드, 오리콘, 차트, 순위, 진입, 성료, 마무리,
              사라진다, 데뷔 이래, 데뷔 후, 데뷔 12년, 데뷔 15년]

  CONTRACT_NEW:
    label: 전속계약·이적·재계약
    type: PRE
    impact: 2
    lead_days: 120
    keywords: [전속계약 체결, 전속계약, 재계약, 이적, 매니지먼트 계약, 계약 연장]
    require_any: [전속계약, 재계약, 이적, 매니지먼트 계약]
    exclude: [드라마, 예능, 프로그램, 중계권, 방송, 출연 계약, 광고 계약, 합류]

  LABEL_CORP:
    label: 레이블 신설·투자·M&A
    type: PRE
    impact: 2
    lead_days: 150
    keywords: [레이블 설립, 자회사 설립, 지분 취득, 투자 유치, 시리즈 A, 시리즈 B,
               상장 추진, 예비심사, 조인트벤처]
    require_any: [레이블, 자회사, 지분, 투자 유치, 상장, 예비심사, 인수 계약]
    # 해외기업·타업종 M&A 기사 유입 차단
    exclude: [달러, 나스닥, 뉴욕증시, 바이오, 제약, 반도체, 코인, 리츠,
              애브비, SPAC, 스팩, 채권 발행, 인수금융, 차환]

  TOUR_MD:
    label: 투어·콘서트·팬미팅 (MD 수요)
    type: PRE
    impact: 3
    lead_days: 60
    keywords: [월드투어, 단독 콘서트, 팬미팅, 팬콘, 투어 확정, 콘서트 개최,
               티켓 오픈, 아시아 투어, 앙코르]
    require_any: [투어, 콘서트, 팬미팅, 팬콘, 티켓]
    # 이미 끝난 공연은 발주 신호가 아님
    exclude: [성료, 마쳤다, 마무리, 종료, 폐막, 후기, 리뷰, 관람]

  POPUP_COLLAB:
    label: 팝업·콜라보·MD
    type: PRE
    impact: 2
    lead_days: 45
    keywords: [팝업스토어, 팝업 오픈, 굿즈 출시, MD 출시, 한정판, 스페셜 에디션,
               IP 라이선스, 브랜드 앰버서더]
    require_any: [팝업, 굿즈, MD, 한정판, 에디션, 라이선스]
    exclude: [게임, 앱, 카드사, 통신사 요금제, 시식, 식품]

  # ── 사후지표 ─────────────────────────────────────
  SALES_RESULT:
    label: 판매실적·초동
    type: POST
    impact: 2
    lead_days: -7
    # 빌보드·오리콘 순위 기사는 발주와 무관 → 실물 판매량 지표만 채택
    keywords: [초동, 초동 판매량, 밀리언셀러, 더블 밀리언, 트리플 밀리언,
               한터차트, 써클차트, 선주문량, 판매량 돌파, 만 장 돌파]
    require_any: [초동, 밀리언, 선주문, 판매량, 만 장, 한터, 써클]
    exclude: [스트리밍, 조회수, 유튜브, 음원차트, 인기투표, 스타랭킹]

  ARTIST_RISK:
    label: 아티스트 리스크
    type: POST
    impact: 3
    lead_days: 0
    escalate: true
    keywords: [활동 중단, 활동 잠정, 탈퇴, 팀 해체, 계약 종료, 학폭, 음주운전,
               마약, 도박, 입대, 군 입대, 병역, 일정 취소, 발매 연기, 공연 취소,
               건강 이상, 수술, 회복 집중]
    require_any: [활동 중단, 탈퇴, 해체, 계약 종료, 학폭, 음주운전, 마약, 도박,
                  입대, 병역, 취소, 연기, 수술, 회복]
    # '시부상·부고·법조계 부상' 등 오탐 원천 차단
    exclude: [시부상, 부친상, 모친상, 빙부상, 빙모상, 별세, 조문, 발인, 부고,
              변호사, 판사, 검사, 법률신문, 인사, 승진, 부상자, 수상]

  CREDIT_RISK:
    label: 거래처 신용리스크
    type: POST
    impact: 3
    lead_days: 0
    escalate: true
    keywords: [자본잠식, 적자 전환, 영업손실, 감사의견 거절, 한정의견, 관리종목,
               상장폐지, 회생절차, 파산, 부도, 워크아웃, 임금 체불, 가압류,
               세무조사, 대표이사 교체, 희망퇴직, 폐업, 자금난]
    require_any: [자본잠식, 적자, 영업손실, 감사의견, 관리종목, 상장폐지, 회생,
                  파산, 부도, 워크아웃, 체불, 압류, 세무조사, 폐업, 자금난]
    # 동명 해외기업·타업종 실적 기사 차단
    exclude: [달러, 나스닥, 뉴욕증시, Non-GAAP, 플러터, 시포트, 애브비, 바이오, 제약]

  LEGAL_DISPUTE:
    label: 계약분쟁·소송
    type: POST
    impact: 3
    lead_days: 0
    escalate: true
    keywords: [전속계약 분쟁, 계약 해지, 가처분, 손해배상, 고소, 고발,
               내용증명, 공정위, 표준계약서 위반, 법적 대응]
    require_any: [전속계약, 계약 해지, 가처분, 손해배상, 고소, 고발, 소송, 공정위]
    exclude: [명예훼손, 악플, 사생활 침해, 루머, 허위사실, 조정 순이익, 흑자]

# ── 전역 부정 키워드: 어떤 카테고리든 이 단어가 있으면 기각 ──
global_exclude:
  [부고, 별세, 시부상, 빙부상, 조문, 발인, 채용 공고, 부동산, 청약, 환율,
   코스피 마감, 코스닥 마감, 로또, 날씨, 사설, 칼럼, 오늘의 운세,
   나스닥, 뉴욕증시, 다우지수, 비트코인, 게임메카, 헝그리앱, 모바일 게임]

# ── 확실성 가중 ──
certainty:
  official: {weight: 1.0, signals: [공식, 공시, 보도자료, 확정, 밝혔다, 발표했다]}
  press:    {weight: 0.7, signals: [알려졌다, 전해졌다, 예정, 유력, 계획]}
  rumor:    {weight: 0.4, signals: [설, 추측, 관측, 것으로 보인다, 논의 중, 검토 중]}

# ── 보도 확산 배수: 같은 이벤트를 여러 매체가 보도 = 신뢰도 상승 ──
corroboration: {1: 1.0, 2: 1.05, 3: 1.15, 5: 1.25, 8: 1.3}

tier_multiplier: {S: 1.8, A: 1.4, B: 1.0, C: 0.7, D: 0.5}

# ── 임계값 (이론상 최대 7.02) ──
alert_threshold:
  URGENT: 5.0
  DAILY: 3.0
  ARCHIVE: 0.0

# ── 일일 분량 상한 (과다 노출 방지) ──
caps:
  per_company: 3        # 거래처당 최대 이벤트 수
  urgent: 15            # 긴급 최대
  daily: 40             # 일일브리프 최대
